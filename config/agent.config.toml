##########################
# QUOMODO AGENT CONFIG   #
##########################

## Default config file for the Quomodo agent (`quomodo-agent`).
## It documents every field. Fields with a "Default" are optional.
##
## Install it as `/etc/quomodo/config.toml`. The agent keeps its key pair in
## `/etc/quomodo/keys/agent.key` and pins Core's public key in
## `/etc/quomodo/keys/core.pub`. See docs/install.md.
##
## The agent only dials out to Core. There is no inbound listener,
## no passkey, and no TLS to configure on the agent.
##
## Most fields can also be configured using environment variables.
## Environment variables override values set in this file.

##############
# CONNECTION #
##############

## The Core address the agent dials. wss:// only: the key handshake
## authenticates both ends but does not encrypt the session, and Core sends
## resolved secrets over it. `https://` and a bare host[:port] become wss://.
## The agent refuses to start on a ws:// or http:// address.
## Env: PERIPHERY_CORE_ADDRESSES
core_addresses = ["wss://quomodo.example.com"]

## The Server name (or id) this agent connects as. Must match a Server resource on Core.
## Env: PERIPHERY_CONNECT_AS
connect_as = ""

## Verify Core's TLS certificate against the CA certificates in this PEM file
## instead of the system roots. For a Core with a certificate from a private
## CA. There is no option to skip verification.
## Env: PERIPHERY_CORE_TLS_CA_FILE
## Default: none, the system roots
# core_tls_ca_file = "/etc/quomodo/ca.pem"

## The agent private key used with the noise handshake.
## Supports openssl generated pem file, `openssl genpkey -algorithm X25519 -out agent.key`.
## If the file does not exist, one is generated at the path on first start.
## Env: PERIPHERY_PRIVATE_KEY or PERIPHERY_PRIVATE_KEY_FILE
## Default: file:${config_directory}/keys/agent.key
# private_key = "file:/etc/quomodo/keys/agent.key"

## Pin Core's public key. If the file does not exist it is written on the first successful connection.
## Env: PERIPHERY_CORE_PUBLIC_KEYS
## Default: ["file:${config_directory}/keys/core.pub"]
# core_public_keys = ["file:/etc/quomodo/keys/core.pub"]

## Optional onboarding key, used only when the Server does not exist on Core yet.
## Env: PERIPHERY_ONBOARDING_KEY or PERIPHERY_ONBOARDING_KEY_FILE
# onboarding_key = "file:/etc/quomodo/keys/onboarding.key"

###############
# DIRECTORIES #
###############

## Holds the config and keys.
## Env: PERIPHERY_CONFIG_DIRECTORY
## Default: /etc/quomodo, or ~/.config/quomodo when not run as root
# config_directory = "/etc/quomodo"

## Working state: repo clones under ./repos, deploy state under ./state,
## the user namespace slice table in ./idmap.json.
## Env: PERIPHERY_ROOT_DIRECTORY
## Default: /var/lib/quomodo, or ~/.local/share/quomodo when not run as root
# root_directory = "/var/lib/quomodo"

## Override the directory repos are cloned into.
## Env: PERIPHERY_REPO_DIR
## Default: ${root_directory}/repos
# repo_dir = "/var/lib/quomodo/repos"

## The systemd quadlet directory. Each Stack is installed as a subdirectory.
## Env: PERIPHERY_QUADLET_DIR
## Default: /etc/containers/systemd, or ~/.config/containers/systemd when
## not run as root
# quadlet_dir = "/etc/containers/systemd"

#########
# STATS #
#########

## The rate at which system stats are polled.
## Env: PERIPHERY_STATS_POLLING_RATE
## Default: 5-sec
stats_polling_rate = "5-sec"

## If non-empty, only these mount paths are included in the disk report.
## Env: PERIPHERY_INCLUDE_DISK_MOUNTS
## Default: []
include_disk_mounts = []

## Exclude these mount paths from the disk report.
## Env: PERIPHERY_EXCLUDE_DISK_MOUNTS
## Default: []
exclude_disk_mounts = []

###########
# LOGGING #
###########

## Options: off, error, warn, info, debug, trace
## Env: PERIPHERY_LOGGING_LEVEL
## Default: info
logging.level = "info"

## Options: standard, json, none
## Env: PERIPHERY_LOGGING_STDIO
## Default: standard
logging.stdio = "standard"

## Optional opentelemetry otlp endpoint, eg http://localhost:4317.
## Env: PERIPHERY_LOGGING_OTLP_ENDPOINT
logging.otlp_endpoint = ""

## Env: PERIPHERY_LOGGING_OPENTELEMETRY_SERVICE_NAME
## Default: Periphery
logging.opentelemetry_service_name = "quomodo-agent"

## Env: PERIPHERY_LOGGING_OPENTELEMETRY_SCOPE_NAME
## Default: Komodo
logging.opentelemetry_scope_name = "quomodo"

## Multi-line, human readable logs.
## Env: PERIPHERY_LOGGING_PRETTY
## Default: false
logging.pretty = false

## Multi-line startup config log.
## Env: PERIPHERY_PRETTY_STARTUP_CONFIG
## Default: false
pretty_startup_config = false

#################
# GIT PROVIDERS #
#################

## Agent-side git credentials for cloning private repos.
## Core-side provider accounts are used first.
# [[git_provider]]
# domain = "git.example.com"
# accounts = [
# 	{ username = "deploy", token = "access_token" },
# ]

######################
# REGISTRY PROVIDERS #
######################

## Agent-side registry credentials for `podman login` before pulling images.
# [[image_registry]]
# domain = "docker.io"
# accounts = [
# 	{ username = "user", token = "access_token" }
# ]
