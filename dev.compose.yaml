# Dev only: core + mongo on a docker host. Agents are installed on real
# podman hosts, there is no agent container.
services:
  core:
    build:
      context: .
      dockerfile: bin/core/Dockerfile
    restart: unless-stopped
    ports:
      - 9120:9120
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: admin
      KOMODO_DATABASE_PASSWORD: admin
      KOMODO_ENABLE_NEW_USERS: true
      KOMODO_LOCAL_AUTH: true
      KOMODO_JWT_SECRET: a_random_secret
    volumes:
      - repo-cache:/repo-cache

  mongo:
    image: mongo:8
    restart: unless-stopped
    command: --quiet --wiredTigerCacheSizeGB 0.25
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb

volumes:
  repo-cache:
  mongo-data:
  mongo-config:
