name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: docker # the runner's default image carries node, which actions/checkout needs
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          apt-get update -qq && apt-get install -y -qq curl build-essential pkg-config perl > /dev/null
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Test
        run: cargo test --workspace

  ui:
    name: typecheck and build the UI
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      - name: Build client
        run: cd client/core/ts && yarn --frozen-lockfile && yarn build && yarn link
      - name: Build UI
        run: cd ui && yarn link komodo_client && yarn --frozen-lockfile && yarn build
