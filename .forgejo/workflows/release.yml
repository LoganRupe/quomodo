# Tagged releases only. No edge builds. The Forgejo twin of
# .github/workflows/release.yml, for a copy of the repo hosted on Forgejo.
#
# - x86_64 agent binary attached to the Forgejo release as `quomodo-agent-x86_64`
#   (plus its .sha256)
# - core image pushed as <image>:<tag> and <image>:latest
#
# Repository settings (docs/releasing.md):
# - variable QUOMODO_IMAGE: where the core image goes, eg forgejo.example.com/org/quomodo.
#   Default: <this Forgejo's host>/<owner>/<repo>
# - variable CI_PACKAGE_USERNAME and secret CI_PACKAGE_TOKEN: a user and a token
#   with package write on that registry namespace. The automatic token cannot push.
#
# aarch64 is added when a host needs it.
name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  agent:
    name: agent binary (x86_64)
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          apt-get update -qq && apt-get install -y -qq curl build-essential pkg-config perl jq > /dev/null
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cargo install cargo-edit --locked -q
          cargo set-version -p komodo_periphery "$VERSION"
          cargo build -p komodo_periphery --release
          cp target/release/quomodo-agent quomodo-agent-x86_64
          sha256sum quomodo-agent-x86_64 > quomodo-agent-x86_64.sha256
      - name: Create release and upload assets
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -eu
          release_id=$(curl -sf -H "Authorization: token $TOKEN" "$API/releases/tags/$GITHUB_REF_NAME" | jq -r .id || true)
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            release_id=$(curl -sf -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"$GITHUB_REF_NAME\",\"draft\":false,\"prerelease\":false}" \
              "$API/releases" | jq -r .id)
          fi
          for f in quomodo-agent-x86_64 quomodo-agent-x86_64.sha256; do
            curl -sf -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$f" "$API/releases/$release_id/assets?name=$f" >/dev/null
            echo "uploaded $f"
          done

  core-image:
    name: core image
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      - name: Install Docker CLI + Buildx (talks to the runner's DinD daemon)
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl iproute2 > /dev/null
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get update -qq
          apt-get install -y -qq docker-ce-cli docker-buildx-plugin > /dev/null
          GW="$(ip route show default | awk '{print $3; exit}')"
          echo "DOCKER_HOST=tcp://${GW}:2375" >> "$GITHUB_ENV"
          export DOCKER_HOST="tcp://${GW}:2375"
          docker version
      - name: Build and push
        env:
          QUOMODO_IMAGE: ${{ vars.QUOMODO_IMAGE }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SERVER_HOST="${GITHUB_SERVER_URL#*://}"
          IMAGE="${QUOMODO_IMAGE:-${SERVER_HOST%%/*}/${GITHUB_REPOSITORY}}"
          IMAGE="${IMAGE,,}"
          REGISTRY="${IMAGE%%/*}"
          echo "pushing $IMAGE"
          # A package-write token: the automatic GITHUB_TOKEN cannot push to the registry.
          echo "${{ secrets.CI_PACKAGE_TOKEN }}" | docker login "${REGISTRY}" -u "${{ vars.CI_PACKAGE_USERNAME }}" --password-stdin
          docker buildx build --file bin/core/Dockerfile --build-arg VERSION="$VERSION" \
            --tag "$IMAGE:$GITHUB_REF_NAME" --tag "$IMAGE:latest" --push .
