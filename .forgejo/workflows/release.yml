# Tagged releases only. No edge builds.
#
# - x86_64 agent binary attached to the Forgejo release as `quomodo-agent-x86_64`
# - core image pushed to this Forgejo's container registry as
#   <registry>/<owner>/quomodo:<tag> and :latest
#
# aarch64 is added when a host needs it.
name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  agent:
    name: Agent binary (x86_64)
    runs-on: docker
    container:
      image: rust:1.98.0-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cargo install cargo-edit
          cargo set-version -p komodo_periphery "$VERSION"
          cargo build -p komodo_periphery --release
          cp target/release/quomodo-agent quomodo-agent-x86_64
          sha256sum quomodo-agent-x86_64 > quomodo-agent-x86_64.sha256
      - name: Create release and upload assets
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -eu
          apt-get update -qq && apt-get install -y -qq jq >/dev/null
          release_id=$(curl -sf -H "Authorization: token $TOKEN" "$API/releases/tags/$GITHUB_REF_NAME" | jq -r .id || true)
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            release_id=$(curl -sf -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"$GITHUB_REF_NAME\",\"draft\":false,\"prerelease\":false}" \
              "$API/releases" | jq -r .id)
          fi
          for f in quomodo-agent-x86_64 quomodo-agent-x86_64.sha256; do
            curl -sf -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$f" "$API/releases/$release_id/assets?name=$f" >/dev/null
            echo "uploaded $f"
          done

  core-image:
    name: Core image
    runs-on: docker
    container:
      image: quay.io/podman/stable
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Version and registry
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "REGISTRY=${GITHUB_SERVER_URL#https://}" >> "$GITHUB_ENV"
          echo "IMAGE=${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY_OWNER}/quomodo" >> "$GITHUB_ENV"
      - name: Build
        run: |
          podman build -f bin/core/Dockerfile --build-arg VERSION="$VERSION" \
            -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest" .
      - name: Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          podman login "$REGISTRY" -u "$GITHUB_ACTOR" -p "$TOKEN"
          podman push "$IMAGE:$GITHUB_REF_NAME"
          podman push "$IMAGE:latest"
