name: Feature request
description: Something Quomodo should do that it doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and where Quomodo gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work, from the user's side. Config or API sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or other ways to solve it.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: Docker, compose, Swarm, terminals and an inbound agent listener were removed on purpose (see CONTRIBUTING.md).
      options:
        - label: This isn't a request to bring one of those back.
          required: true
