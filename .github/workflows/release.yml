# Tagged releases only. No edge builds.
#
# - x86_64 agent binary attached to the GitHub release as `quomodo-agent-x86_64`
#   (plus its .sha256)
# - core image pushed to ghcr.io/<owner>/<repo>:<tag> and :latest, or to the
#   repository variable QUOMODO_IMAGE if set (another ghcr.io path)
#
# Both jobs use the automatic GITHUB_TOKEN; nothing else to configure.
# aarch64 is added when a host needs it.
name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  agent:
    name: agent binary (x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cargo install cargo-edit --locked -q
          cargo set-version -p komodo_periphery "$VERSION"
          cargo build -p komodo_periphery --release
          cp target/release/quomodo-agent quomodo-agent-x86_64
          sha256sum quomodo-agent-x86_64 > quomodo-agent-x86_64.sha256
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag --notes ""
          gh release upload "$GITHUB_REF_NAME" quomodo-agent-x86_64 quomodo-agent-x86_64.sha256 --clobber

  core-image:
    name: core image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        env:
          QUOMODO_IMAGE: ${{ vars.QUOMODO_IMAGE }}
        run: |
          IMAGE="${QUOMODO_IMAGE:-ghcr.io/${GITHUB_REPOSITORY}}"
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: bin/core/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          push: true
