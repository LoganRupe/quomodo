name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Test
        run: cargo test --workspace

  ui:
    name: typecheck and build the UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build client
        run: cd client/core/ts && yarn --frozen-lockfile && yarn build && yarn link
      - name: Build UI
        run: cd ui && yarn link komodo_client && yarn --frozen-lockfile && yarn build
