version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 14 }
    groups:
      cargo: { patterns: ["*"] }
  - package-ecosystem: npm
    directories: [/ui, /client/core/ts]
    schedule: { interval: monthly }
    cooldown: { default-days: 14 }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 14 }
  - package-ecosystem: docker
    directory: /bin/core
    schedule: { interval: monthly }
    cooldown: { default-days: 14 }
